<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PwdAssist - Secure Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #334155;
      --primary: #1e3a5f;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      
      --rose: #f43f5e;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --emerald: #10b981;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 60px -10px rgba(0,0,0,0.15);
      
      --radius-md: 0.5rem;
      --radius-lg: 1rem;
      --radius-xl: 1.5rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--gray-50);
      color: var(--navy-900);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    /* Vault Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 48rem; /* max-w-3xl */
      margin-bottom: 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--navy-900);
    }
    
    .brand svg {
      width: 1.5rem;
      height: 1.5rem;
      color: var(--primary);
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      background: rgba(16, 185, 129, 0.1);
      color: var(--emerald);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 48rem;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Glassmorphism accent */
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--blue));
    }

    /* Password Display Area */
    .display-area {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      position: relative;
      margin-bottom: 2rem;
      transition: all 300ms ease;
    }
    
    .display-area:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .password-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: 0.1em;
      filter: blur(8px);
      transition: filter 300ms ease, opacity 300ms ease;
      word-break: break-all;
      user-select: none;
    }

    .password-display.revealed {
      filter: blur(0);
      user-select: text;
    }

    .toggle-reveal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--gray-500);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: var(--radius-md);
      transition: all 200ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-reveal:hover {
      background: var(--gray-200);
      color: var(--navy-900);
    }
    
    .toggle-reveal:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* Strength Meter */
    .strength-section {
      margin-bottom: 2rem;
    }
    
    .strength-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-500);
    }

    .strength-label {
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .strength-text {
      font-weight: 600;
      transition: color 300ms ease;
    }

    .strength-bars {
      display: flex;
      gap: 0.5rem;
      height: 0.5rem;
    }

    .bar {
      flex: 1;
      background: var(--gray-200);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0; width: 100%;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1), background-color 300ms ease;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    @media (max-width: 640px) {
      .controls { grid-template-columns: 1fr; }
    }

    .slider-group {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--navy-800);
    }
    
    .slider-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--primary);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 1.25rem;
      width: 1.25rem;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      margin-top: -0.375rem;
      box-shadow: var(--shadow-md);
      transition: transform 100ms ease;
    }
    
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 0.5rem;
      cursor: pointer;
      background: var(--gray-200);
      border-radius: 999px;
    }
    
    input[type=range]:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 4px;
      border-radius: 999px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--primary);
      cursor: pointer;
    }
    
    .checkbox-group input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .checkbox-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--navy-800);
      cursor: pointer;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    @media (max-width: 640px) {
      .actions { flex-direction: column; }
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 200ms ease;
    }

    .btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 58, 95, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--navy-900);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 58, 95, 0.3);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-secondary:hover {
      background-color: rgba(30, 58, 95, 0.05);
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 600ms linear;
      background-color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }
    
    .btn-secondary .ripple {
      background-color: rgba(30, 58, 95, 0.1);
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* Breach Check */
    .breach-check {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 200ms ease;
    }

    .breach-check:hover {
      border-color: var(--gray-400);
      background: var(--gray-100);
    }
    
    .breach-check:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .breach-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .breach-icon {
      color: var(--gray-500);
      display: flex;
    }

    .breach-text {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--navy-800);
    }

    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 50;
      pointer-events: none;
    }

    .toast {
      background: var(--navy-900);
      color: var(--white);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow-lg);
      transform: translateX(120%);
      transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateX(0);
    }
    
    .toast.success .toast-icon { color: var(--emerald); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      PwdAssist
    </div>
    <div class="status-chip">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Secure Connection
    </div>
  </header>

  <!-- Main Vault -->
  <main class="container">
    
    <!-- Display Area -->
    <div class="display-area" tabindex="0">
      <div class="password-display" id="password-display">••••••••••••••••</div>
      <button class="toggle-reveal" id="toggle-reveal" aria-label="Reveal Password" title="Reveal Password">
        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <!-- Strength Meter -->
    <div class="strength-section">
      <div class="strength-header">
        <span class="strength-label">Security Grade</span>
        <span class="strength-text" id="strength-text">Evaluating...</span>
      </div>
      <div class="strength-bars">
        <div class="bar"><div class="bar-fill" id="bar-1"></div></div>
        <div class="bar"><div class="bar-fill" id="bar-2"></div></div>
        <div class="bar"><div class="bar-fill" id="bar-3"></div></div>
        <div class="bar"><div class="bar-fill" id="bar-4"></div></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="slider-group">
        <div class="slider-header">
          <label for="length-slider">Length</label>
          <span class="slider-value" id="length-value">16</span>
        </div>
        <input type="range" id="length-slider" min="8" max="64" value="16" aria-label="Password length">
      </div>
      
      <label class="checkbox-group">
        <input type="checkbox" id="cb-upper" checked>
        Uppercase Letters (A-Z)
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="cb-lower" checked>
        Lowercase Letters (a-z)
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="cb-numbers" checked>
        Numbers (0-9)
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="cb-symbols" checked>
        Special Symbols (!@#$)
      </label>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="btn-copy">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copy-text">Copy to Clipboard</span>
      </button>
      <button class="btn btn-secondary" id="btn-generate">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Generate New
      </button>
    </div>

    <!-- Breach Check -->
    <div class="breach-check" id="btn-breach" tabindex="0" role="button">
      <div class="breach-info">
        <div class="breach-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
          </svg>
        </div>
        <span class="breach-text">Check against known breaches</span>
      </div>
      <div class="spinner" id="breach-spinner"></div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // Elements
    const pwDisplay = document.getElementById('password-display');
    const toggleReveal = document.getElementById('toggle-reveal');
    const eyeIcon = document.getElementById('eye-icon');
    const lengthSlider = document.getElementById('length-slider');
    const lengthValue = document.getElementById('length-value');
    
    const cbUpper = document.getElementById('cb-upper');
    const cbLower = document.getElementById('cb-lower');
    const cbNumbers = document.getElementById('cb-numbers');
    const cbSymbols = document.getElementById('cb-symbols');
    
    const btnCopy = document.getElementById('btn-copy');
    const copyText = document.getElementById('copy-text');
    const btnGenerate = document.getElementById('btn-generate');
    const btnBreach = document.getElementById('btn-breach');
    const breachSpinner = document.getElementById('breach-spinner');
    
    const barFills = [
      document.getElementById('bar-1'),
      document.getElementById('bar-2'),
      document.getElementById('bar-3'),
      document.getElementById('bar-4')
    ];
    const strengthText = document.getElementById('strength-text');
    const toastContainer = document.getElementById('toast-container');

    // State
    let currentPassword = '';
    let isRevealed = false;

    // Generators
    const charSets = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
    };

    function generatePassword() {
      let charset = '';
      if (cbUpper.checked) charset += charSets.upper;
      if (cbLower.checked) charset += charSets.lower;
      if (cbNumbers.checked) charset += charSets.numbers;
      if (cbSymbols.checked) charset += charSets.symbols;

      // Fallback if none selected
      if (charset === '') {
        cbLower.checked = true;
        charset += charSets.lower;
      }

      const length = parseInt(lengthSlider.value);
      let password = '';
      const array = new Uint32Array(length);
      window.crypto.getRandomValues(array);
      
      for (let i = 0; i < length; i++) {
        password += charset[array[i] % charset.length];
      }

      currentPassword = password;
      pwDisplay.textContent = password;
      updateStrengthMeter(password);
    }

    function calculateStrength(pw) {
      let score = 0;
      if (pw.length >= 12) score += 1;
      if (pw.length >= 16) score += 1;
      
      let variety = 0;
      if (/[A-Z]/.test(pw)) variety++;
      if (/[a-z]/.test(pw)) variety++;
      if (/[0-9]/.test(pw)) variety++;
      if (/[^A-Za-z0-9]/.test(pw)) variety++;

      if (variety >= 3) score += 1;
      if (variety === 4 && pw.length >= 12) score += 1;

      return Math.min(score, 4); // 0 to 4
    }

    function updateStrengthMeter(pw) {
      const score = calculateStrength(pw);
      
      const config = {
        0: { text: 'Weak', color: 'var(--rose)' },
        1: { text: 'Weak', color: 'var(--rose)' },
        2: { text: 'Fair', color: 'var(--amber)' },
        3: { text: 'Strong', color: 'var(--blue)' },
        4: { text: 'Unbreakable', color: 'var(--emerald)' }
      };

      const current = config[score === 0 ? 1 : score];
      strengthText.textContent = current.text;
      strengthText.style.color = current.color;

      barFills.forEach((bar, index) => {
        if (index < score || (score === 0 && index === 0)) {
          bar.style.transform = 'scaleX(1)';
          bar.style.backgroundColor = current.color;
        } else {
          bar.style.transform = 'scaleX(0)';
        }
      });
    }

    // Interactions
    lengthSlider.addEventListener('input', (e) => {
      lengthValue.textContent = e.target.value;
      generatePassword();
    });

    [cbUpper, cbLower, cbNumbers, cbSymbols].forEach(cb => {
      cb.addEventListener('change', generatePassword);
    });

    btnGenerate.addEventListener('click', (e) => {
      createRipple(e, btnGenerate);
      generatePassword();
    });

    toggleReveal.addEventListener('click', () => {
      isRevealed = !isRevealed;
      if (isRevealed) {
        pwDisplay.classList.add('revealed');
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        pwDisplay.classList.remove('revealed');
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    btnCopy.addEventListener('click', async (e) => {
      createRipple(e, btnCopy);
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(currentPassword);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = currentPassword;
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
        
        // Success state
        copyText.textContent = "Copied!";
        const originalHtml = btnCopy.innerHTML;
        btnCopy.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Copied!
        `;
        btnCopy.style.backgroundColor = "var(--emerald)";
        btnCopy.style.borderColor = "var(--emerald)";
        btnCopy.style.boxShadow = "0 4px 12px rgba(16, 185, 129, 0.3)";
        
        setTimeout(() => {
          btnCopy.innerHTML = originalHtml;
          btnCopy.style.backgroundColor = "";
          btnCopy.style.borderColor = "";
          btnCopy.style.boxShadow = "";
          copyText.textContent = "Copy to Clipboard";
        }, 2000);
        
      } catch (err) {
        showToast("Failed to copy. Please copy manually.", "error");
      }
    });

    btnBreach.addEventListener('click', () => {
      // Prevent multiple clicks
      if (breachSpinner.style.display === 'block') return;
      
      breachSpinner.style.display = 'block';
      const breachIcon = btnBreach.querySelector('.breach-icon');
      breachIcon.style.display = 'none';
      
      setTimeout(() => {
        breachSpinner.style.display = 'none';
        breachIcon.style.display = 'block';
        showToast("No breaches found for this password in our database", "success");
      }, 1500);
    });
    
    btnBreach.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        btnBreach.click();
      }
    });

    // Ripple effect generator
    function createRipple(event, button) {
      const circle = document.createElement('span');
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;
      
      const rect = button.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');
      
      const ripple = button.querySelector('.ripple');
      if (ripple) ripple.remove();
      button.appendChild(circle);
    }

    // Toast generator
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type} show`;
      
      const icon = type === 'success' 
        ? '<svg class="toast-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
        : '<svg class="toast-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        
      toast.innerHTML = `${icon} <span>${message}</span>`;
      toastContainer.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Init
    generatePassword();
  </script>
</body>
</html>
